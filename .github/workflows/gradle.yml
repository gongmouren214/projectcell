# .github/workflows/gradle.yml
name: Build ProjectCell Fix TPS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle.properties', 'build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build with Gradle
        run: ./gradlew forgeBuild --no-daemon --console=plain
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: built-jar
          path: forge/build/libs/*.jar
